<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المحارب س: مغامرة المحيط الأحمر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

        :root {
            --clay-blue: #4facfe;
            --clay-red: #ff4d4d;
            --clay-gold: #ffcc33;
            --text-dark: #2d3436;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Cairo', sans-serif;
            overflow: hidden; /* لمنع التمرير على الجوال */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            touch-action: none; /* لمنع إيماءات المتصفح على الجوال */
        }

        /* حاوية اللعبة المتجاوبة */
        #game-container {
            position: relative;
            border: 8px solid #333;
            box-shadow: 20px 20px 60px #000, -5px -5px 20px #444;
            border-radius: 30px;
            background-color: #000;
            overflow: hidden;
            width: 95vw; /* عرض متجاوب */
            max-width: 1000px; /* الحد الأقصى للعرض على اللابتوب */
            aspect-ratio: 10 / 6; /* الحفاظ على نسبة الطول والعرض */
            height: auto;
        }

        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            object-fit: contain;
        }

        /* شاشات اللعبة */
        #start-screen, #win-screen, #lose-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #win-screen, #lose-screen { display: none; }

        h1 {
            font-size: clamp(24px, 5vw, 45px); /* حجم خط متجاوب */
            margin-bottom: 20px;
            background: white;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: inset 6px 6px 12px #cfd3da, inset -6px -6px 12px #ffffff, 8px 8px 15px rgba(0,0,0,0.2);
            color: var(--clay-blue);
        }

        .btn {
            padding: 15px 45px;
            font-size: clamp(18px, 3vw, 24px);
            background: var(--clay-blue);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 6px 6px 12px rgba(0,0,0,0.3), inset 4px 4px 8px rgba(255,255,255,0.4);
            font-weight: 900;
            margin: 15px;
        }

        .btn:hover { transform: scale(1.1); background: #3b8fd9; }

        #ui-layer {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }

        .stat-box {
            background: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: clamp(12px, 2vw, 18px);
            color: var(--text-dark);
            box-shadow: 8px 8px 16px rgba(0,0,0,0.2), inset 4px 4px 6px #ffffff;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }

        .low-ammo {
            background: #ffcccc;
            color: #d63031;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 750px;
            background: white;
            border-radius: 30px;
            padding: clamp(20px, 4vw, 40px);
            text-align: center;
            display: none;
            z-index: 150;
            box-shadow: 20px 20px 40px rgba(0,0,0,0.4), inset 10px 10px 20px #fff;
            color: var(--text-dark);
            box-sizing: border-box;
        }

        #timer-bar {
            height: 15px;
            background: #eee;
            width: 100%;
            margin-top: 25px;
            border-radius: 10px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        #timer-fill { 
            height: 100%; 
            background: var(--clay-blue); 
            width: 100%; 
        }

        /* أزرار التحكم باللمس (تظهر فقط على الشاشات الصغيرة) */
        #touch-controls {
            display: none;
            width: 95vw;
            max-width: 1000px;
            margin-top: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
        }

        .touch-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
        }
        
        .touch-btn:active { background: rgba(255, 255, 255, 0.5); }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        .action-pad {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #btn-fire {
            width: 80px;
            height: 80px;
            background: var(--clay-red);
            border: 3px solid #fff;
            border-radius: 50%;
            font-weight: bold;
            font-size: 18px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        @media (max-width: 800px) {
            #touch-controls { display: flex; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- شاشة البداية -->
        <div id="start-screen">
            <h1>المحارب س:<br>مغامرة المحيط الأحمر</h1>
            <button class="btn" id="start-btn" onclick="startGame()">ابدأ المغامرة الآن</button>
            <p style="color:white; margin-top: 20px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; font-size: clamp(14px, 2.5vw, 18px);">
                💻 للكمبيوتر: الأسهم للتحرك والمسافة للإطلاق<br>
                🎮 للبلايستيشن: الأسهم للتحرك و ✖ للإطلاق<br>
                📱 للجوال: استخدم أزرار الشاشة
            </p>
        </div>

        <!-- شاشة الفوز -->
        <div id="win-screen">
            <h1 style="color: #27ae60;">🏆 تم القضاء على التنين!</h1>
            <p id="win-text" style="font-size: clamp(16px, 3vw, 22px); line-height: 1.6; color: white; padding: 0 20px;"></p>
            <button class="btn" onclick="location.reload()">إعادة المغامرة</button>
        </div>

        <!-- شاشة الخسارة -->
        <div id="lose-screen">
            <h1 style="color: var(--clay-red);">❌ تراجع المحارب!</h1>
            <p id="lose-msg" style="font-size: clamp(16px, 3vw, 22px); margin-bottom: 30px; color: white; padding: 0 20px;"></p>
            <button class="btn" onclick="location.reload()">محاولة ثانية</button>
        </div>

        <!-- واجهة المستخدم (الذخيرة والرسائل) -->
        <div id="ui-layer">
            <div id="ammo-box" class="stat-box" style="border-bottom: 4px solid var(--clay-blue)">🛡️ ذخيرة المناعة المعلوماتية: <span id="ammo-val" style="color:var(--clay-blue)">50</span></div>
            <div class="stat-box" style="border-bottom: 4px solid var(--clay-gold)">📜 الرسائل: <span id="info-val" style="color:#f39c12">0 / 12</span></div>
        </div>
        
        <canvas id="gameCanvas"></canvas>

        <!-- نافذة المعلومات (النصائح) -->
        <div id="overlay">
            <h2 id="msg-title" style="color:var(--clay-blue); font-size: clamp(20px, 4vw, 30px);">👵 نصيحة الجدة متفائلة</h2>
            <p id="msg-body" style="font-size: clamp(16px, 3vw, 24px); line-height:1.6; font-weight: bold; white-space: pre-line;"></p>
            <div id="timer-bar"><div id="timer-fill"></div></div>
        </div>
    </div>

    <!-- أزرار التحكم باللمس (تظهر على الجوال والآيباد) -->
    <div id="touch-controls">
        <div class="d-pad">
            <div class="touch-btn" id="btn-up">⬆️</div>
            <div class="touch-btn" id="btn-left">⬅️</div>
            <div class="touch-btn" id="btn-right">➡️</div>
            <div class="touch-btn" id="btn-down">⬇️</div>
        </div>
        <div class="action-pad">
            <button id="btn-fire">إطلاق</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ammoEl = document.getElementById('ammo-val');
        const ammoBox = document.getElementById('ammo-box');
        const infoEl = document.getElementById('info-val');
        const overlay = document.getElementById('overlay');
        const msgBody = document.getElementById('msg-body');
        const timerFill = document.getElementById('timer-fill');
        const startScreen = document.getElementById('start-screen');
        const winScreen = document.getElementById('win-screen');
        const loseScreen = document.getElementById('lose-screen');
        const loseMsg = document.getElementById('lose-msg');

        // الحفاظ على أبعاد الرسم الداخلية ثابتة لضمان دقة الاصطدامات
        canvas.width = 1000;
        canvas.height = 600;

        // نظام الصوت
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(freq, type, duration) {
            if (audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // إعداد الخلفية (تم إعادة الامتداد إلى png حسب طلبك)
        const bgImage = new Image();
        bgImage.src = 'Gemini_Generated_Image_4m10rp4m10rp4m10.png'; 
        let bgLoaded = false;
        bgImage.onload = () => { bgLoaded = true; };
        bgImage.onerror = () => { bgLoaded = false; };

        // المحتوى التعليمي
        const infoTexts = [
            "1. سنتعلم ما هي أسباب هجوم التنين على المحيط الأحمر؟\nكيف يمكن أن يتكون؟\nلأننا إذا علمنا بعض الأسباب أمكننا اتقاء شره بإذن الله.",
            "2. قد يتسبب التعرض لإشعاع عالٍ في غزو التنين للمحيط الأحمر مثل التعرض لمصنع للطاقة النووية.",
            "3. وجود اعتلالات ومشكلات في المحيط الأحمر يمكن أن يسبب هجوم التنين عليه.",
            "4. انتشار الفيروسات في المحيط الأحمر يسهل على التنين مهاجمته والسيطرة عليه.",
            "5. كيف يمكن أن نحمي أنفسنا بإذن الله من هجوم التنين؟ فكما يقال: “درهمُ وقاية خيرٌ من قِنْطار عِلاج “.",
            "6. تحصين المحيط الأحمر من العدوى الفيروسية وعدم تعريضه للإشعاع يقيه من الهجوم بإذن الله.",
            "7. إمداد المحيط الأحمر بالغذاء الصحي يساهم بإذن الله في حمايته من فتك التنين.",
            "8. ممارسة الرياضة باستمرار تقي المحيط الأحمر. لأن المحيط الأحمر يجري في عروقك، فمسؤوليتك الحفاظ على نقاوته.",
            "9. سنتعلم كيف يمكن القضاء على التنين في حال مهاجمته للمحيط الأحمر وما هي أسلحتنا؟",
            "10. العلاج الإشعاعي أحد الأسلحة التي يمكن بها القضاء على التنين.",
            "11. الخلايا الجذعية أحد الأسلحة لإنقاذ المحيط الأحمر.",
            "12. العلاج المناعي أحد الأسلحة التي يمكن بها القضاء على التنين وإنقاذ المحيط الأحمر."
        ];

        let gameRunning = false;
        let state = {
            ammo: 50,
            infoIndex: 0,
            isPaused: false,
            victoryMode: false,
            dragonHealth: 40,
            maxDragonHealth: 40,
            pulse: 0,
            lastShot: 0
        };

        // إعداد المحارب (حجم البداية 50، الحجم الأقصى تمت زيادته)
        const player = { x: 100, y: 300, size: 50, maxSize: 150, speed: 7, color: '#4facfe' };
        const dragon = { x: 800, y: 300, size: 160, speed: 2.5, color: '#ff4d4d', scale: 1.0, alpha: 1.0 };
        let items = [];
        let flames = [];
        let bullets = [];

        function initItems() {
            items = [];
            for (let i = 0; i < 12; i++) {
                items.push({
                    x: 150 + Math.random() * 750,
                    y: 100 + Math.random() * 400,
                    collected: false
                });
            }
        }

        // === أدوات التحكم ===
        // 1. لوحة المفاتيح
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // 2. التحكم باللمس (الجوال والآيباد)
        const touchState = { up: false, down: false, left: false, right: false, fire: false };
        const setupTouch = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); touchState[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); touchState[key] = false; });
        };
        setupTouch('btn-up', 'up');
        setupTouch('btn-down', 'down');
        setupTouch('btn-left', 'left');
        setupTouch('btn-right', 'right');
        setupTouch('btn-fire', 'fire');

        // 3. دعم ذراع البلايستيشن (Gamepad API)
        function getGamepadInput() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const gp = gamepads[0]; // نأخذ أول ذراع تحكم متصل
            if (!gp) return { up: false, down: false, left: false, right: false, fire: false };

            // قراءة أزرار الأسهم (D-Pad) أو عصا التحكم اليسرى
            const up = gp.buttons[12]?.pressed || gp.axes[1] < -0.5;
            const down = gp.buttons[13]?.pressed || gp.axes[1] > 0.5;
            const left = gp.buttons[14]?.pressed || gp.axes[0] < -0.5;
            const right = gp.buttons[15]?.pressed || gp.axes[0] > 0.5;
            
            // قراءة زر إكس أو مربع للإطلاق
            const fire = gp.buttons[0]?.pressed || gp.buttons[2]?.pressed; 

            return { up, down, left, right, fire };
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            startScreen.style.display = 'none';
            gameRunning = true;
            initItems();
            requestAnimationFrame(gameLoop);
        }

        function gameOver(reason) {
            gameRunning = false;
            loseMsg.innerText = reason;
            loseScreen.style.display = 'flex';
            playSfx(80, 'sawtooth', 0.5);
        }

        function showMessage(text) {
            state.isPaused = true;
            msgBody.innerText = text;
            overlay.style.display = 'block';
            timerFill.style.width = '100%';
            playSfx(440, 'sine', 0.3);
            
            let start = Date.now();
            const duration = 6000;
            const timer = setInterval(() => {
                let elapsed = Date.now() - start;
                let progress = Math.max(0, 100 - (elapsed / duration * 100));
                timerFill.style.width = progress + '%';
                
                if (elapsed >= duration || !gameRunning) {
                    clearInterval(timer);
                    overlay.style.display = 'none';
                    state.isPaused = false;
                    state.infoIndex++;
                    state.ammo += 20;
                    updateAmmoUI();
                    infoEl.innerText = state.infoIndex + " / 12";
                    if (state.infoIndex === 12) finalBattleTrigger();
                }
            }, 50);
        }

        function updateAmmoUI() {
            ammoEl.innerText = state.ammo;
            if (state.ammo < 15) {
                ammoBox.classList.add('low-ammo');
            } else {
                ammoBox.classList.remove('low-ammo');
            }

            if (state.ammo <= 0 && gameRunning) {
                gameOver("لقد نفدت ذخيرة المناعة المعلوماتية تماماً! لا يمكن للمحارب س البقاء قوياً دون وعي كافٍ.");
            }
        }

        function finalBattleTrigger() {
            state.isPaused = true;
            document.getElementById('msg-title').innerText = "⚔️ رسالة الاستعداد";
            msgBody.innerHTML = `<span style="color:var(--clay-red); font-size: 28px;">حان وقت مواجهة التنين!</span><br>كن مستعداً بكل ذخيرتك المعلوماتية لكي تتمكن من القضاء عليه بإذن الله.`;
            overlay.style.display = 'block';
            document.getElementById('timer-bar').style.display = 'none';
            setTimeout(() => {
                overlay.style.display = 'none';
                state.isPaused = false;
                state.victoryMode = true;
            }, 5000);
        }

        function update() {
            if (!gameRunning || state.isPaused) return;
            state.pulse += 0.1;

            // دمج كل مدخلات التحكم (كيبورد، لمس، بلايستيشن)
            const pad = getGamepadInput();
            const input = {
                up: keys['ArrowUp'] || touchState.up || pad.up,
                down: keys['ArrowDown'] || touchState.down || pad.down,
                left: keys['ArrowLeft'] || touchState.left || pad.left,
                right: keys['ArrowRight'] || touchState.right || pad.right,
                fire: keys['Space'] || touchState.fire || pad.fire
            };

            // حركة اللاعب (مع مراعاة حجم اللاعب الديناميكي لمنع الخروج من الشاشة)
            const pRadius = player.size / 2;
            if (input.up && player.y > pRadius) player.y -= player.speed;
            if (input.down && player.y < canvas.height - pRadius) player.y += player.speed;
            if (input.left && player.x > pRadius) player.x -= player.speed;
            if (input.right && player.x < canvas.width - pRadius) player.x += player.speed;

            // الإطلاق
            if (state.victoryMode && input.fire && Date.now() - state.lastShot > 180) {
                if (state.ammo > 0) {
                    bullets.push({ x: player.x + pRadius, y: player.y, vx: 18 });
                    state.ammo--;
                    updateAmmoUI();
                    state.lastShot = Date.now();
                    playSfx(600, 'square', 0.1);
                }
            }

            if (state.victoryMode && state.ammo <= 0 && bullets.length === 0 && state.dragonHealth > 0) {
                gameOver("لقد استنفدت كل الذخيرة ولم يهزم التنين بعد! كن أكثر دقة في المرة القادمة.");
                return;
            }

            // منطق التنين
            const dx = player.x - dragon.x;
            const dy = player.y - dragon.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (!state.victoryMode) {
                dragon.x += (dx / dist) * dragon.speed;
                dragon.y += (dy / dist) * dragon.speed;
            } else {
                dragon.y += Math.sin(state.pulse) * 6;
                dragon.x += (750 - dragon.x) * 0.03;
            }

            const healthRatio = state.dragonHealth / state.maxDragonHealth;
            
            // إضعاف التنين أكثر بناءً على صحته وحجمه
            const fireChance = 0.005 + (0.04 * Math.pow(healthRatio, 1.5)); 
            
            if (Math.random() < fireChance) {
                const angle = Math.atan2(dy, dx);
                const speedMult = 0.3 + (0.7 * healthRatio);
                flames.push({ 
                    x: dragon.x, 
                    y: dragon.y, 
                    vx: Math.cos(angle) * (7 * speedMult), 
                    vy: Math.sin(angle) * (7 * speedMult) 
                });
            }

            // تصادم الرصاص
            bullets.forEach((b, i) => {
                b.x += b.vx;
                const hitRadius = (dragon.size * 0.45) * dragon.scale;
                if (Math.hypot(b.x - dragon.x, b.y - dragon.y) < hitRadius) {
                    bullets.splice(i, 1);
                    state.dragonHealth--;
                    // تصغير حجم التنين بشكل أكبر وأكثر وضوحاً
                    dragon.scale = Math.max(0.25, Math.pow(state.dragonHealth / state.maxDragonHealth, 1.2));
                    dragon.alpha = 0.4 + (0.6 * healthRatio);
                    playSfx(150, 'sawtooth', 0.2);
                    
                    if (state.dragonHealth <= 0) {
                        gameRunning = false;
                        document.getElementById('win-text').innerText = "انتصر المحارب س بفضل الله سبحانه وتعالى ثم بفضل ذخيرته المعلوماتية! لقد تم القضاء على التنين وتحرير المحيط..\n\nولكن.. هل عرفت من هو المحارب س؟ تحقق من إجابتك مع الجدة متفائلة!";
                        winScreen.style.display = 'flex';
                        playSfx(880, 'sine', 1);
                    }
                }
                if (b.x > canvas.width) bullets.splice(i, 1);
            });

            // تصادم نيران التنين
            flames.forEach((f, i) => {
                f.x += f.vx; f.y += f.vy;
                if (Math.hypot(f.x - player.x, f.y - player.y) < pRadius) {
                    // تقليل الضرر كلما كبر حجم المحارب وضعف التنين
                    let damage = Math.ceil(4 * healthRatio * (50 / player.size));
                    if (damage < 1) damage = 1; 

                    state.ammo = Math.max(0, state.ammo - damage);
                    updateAmmoUI();
                    flames.splice(i, 1);
                    playSfx(100, 'sine', 0.3);
                }
                if (f.x < 0 || f.x > canvas.width || f.y < 0 || f.y > canvas.height) flames.splice(i, 1);
            });

            // جمع العناصر (زيادة حجم اللاعب)
            items.forEach(m => {
                if (!m.collected && Math.hypot(player.x - m.x, player.y - m.y) < pRadius + 15) {
                    m.collected = true;
                    // زيادة حجم المحارب س بشكل أكبر ومضاعف
                    player.size = Math.min(player.size + 10, player.maxSize);
                    showMessage(infoTexts[state.infoIndex]);
                }
            });
        }

        function drawClayShape(x, y, r, color, alpha = 1.0, isDragon = false) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 8;
            ctx.shadowOffsetY = 8;

            ctx.fillStyle = color;
            ctx.beginPath();
            const steps = 15;
            for (let i = 0; i <= steps; i++) {
                let a = (i/steps) * Math.PI * 2;
                let wobble = Math.sin(a * (isDragon ? 4 : 3) + state.pulse) * (r * 0.1);
                let rx = x + Math.cos(a) * (r + wobble);
                let ry = y + Math.sin(a) * (r + wobble);
                if (i === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
            }
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = r * 0.2;
            ctx.beginPath();
            ctx.arc(x, y, r * 0.7, Math.PI * 1.2, Math.PI * 1.8);
            ctx.stroke();

            if (!isDragon) {
                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(x + r*0.3, y - r*0.2, r*0.15, 0, 7); ctx.fill();
                ctx.fillStyle = "black";
                ctx.beginPath(); ctx.arc(x + r*0.35, y - r*0.2, r*0.05, 0, 7); ctx.fill();
            } else {
                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(x - r*0.4, y - r*0.2, r*0.2, 0, 7); ctx.fill();
                ctx.fillStyle = "#ffcc33";
                ctx.beginPath(); ctx.arc(x - r*0.45, y - r*0.2, r*0.1, 0, 7); ctx.fill();
            }
            ctx.restore();
        }

        function drawDragonUI() {
            if (!state.victoryMode || state.dragonHealth <= 0) return;
            
            const barW = 120;
            const barH = 10;
            const x = dragon.x - barW/2;
            const y = dragon.y - (dragon.size * dragon.scale)/2 - 25;

            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.roundRect ? ctx.beginPath() || ctx.roundRect(x, y, barW, barH, 5) || ctx.fill() : ctx.fillRect(x, y, barW, barH);
            
            const fillW = (state.dragonHealth / state.maxDragonHealth) * barW;
            ctx.fillStyle = state.dragonHealth < 10 ? "#ff4d4d" : "#ffcc33";
            ctx.roundRect ? ctx.beginPath() || ctx.roundRect(x, y, fillW, barH, 5) || ctx.fill() : ctx.fillRect(x, y, fillW, barH);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (bgLoaded) {
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
            } else {
                let grad = ctx.createRadialGradient(500, 300, 50, 500, 300, 600);
                grad.addColorStop(0, '#300'); grad.addColorStop(1, '#000');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            items.forEach(m => { 
                if(!m.collected) {
                    drawClayShape(m.x, m.y, 22, '#ffcc33');
                    ctx.fillStyle = "white";
                    ctx.font = "bold 16px Cairo";
                    ctx.textAlign = "center";
                    ctx.fillText("ℹ️", m.x, m.y + 7);
                }
            });

            bullets.forEach(b => drawClayShape(b.x, b.y, 12, '#4facfe'));
            flames.forEach(f => drawClayShape(f.x, f.y, 14, '#e67e22'));
            
            if(state.dragonHealth > 0) {
                drawClayShape(dragon.x, dragon.y, (dragon.size/2) * dragon.scale, dragon.color, dragon.alpha, true);
                drawDragonUI();
            }
            
            // رسم المحارب स (الذي يكبر حجمه)
            drawClayShape(player.x, player.y, player.size/2, player.color);
        }

        function gameLoop() {
            update();
            draw();
            if(gameRunning) requestAnimationFrame(gameLoop);
        }

        draw();
    </script>
</body>
